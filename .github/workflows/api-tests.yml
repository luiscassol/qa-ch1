name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Unique X-Candidate-Id (do not reuse your local tenant if that machine is testing)
        required: true
        type: string
      bugs_tier:
        description: X-Enable-Bugs
        required: true
        type: choice
        default: "off"
        options:
          - "off"
          - "easy"
          - "medium"
          - "hard"

# Not a required status check. off is expected to fail (baseline defects, e.g. F-01).
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      API_BASE_URL: https://dummy-api-topaz.vercel.app
      CANDIDATE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_id || format('ci-{0}', github.run_id) }}
      BUGS_TIER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bugs_tier || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
