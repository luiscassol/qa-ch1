name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Unique X-Candidate-Id (do not reuse your local tenant if that machine is testing)
        required: true
        type: string
      bugs_tier:
        description: X-Enable-Bugs
        required: true
        type: choice
        default: "off"
        options:
          - "off"
          - "easy"
          - "medium"
          - "hard"

# Not a required status check. off is expected to fail (baseline defects, e.g. F-01).
# contents: write — push the Allure HTML to the gh-pages branch (no github-pages environment).
permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      API_BASE_URL: https://dummy-api-topaz.vercel.app
      CANDIDATE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_id || format('ci-{0}', github.run_id) }}
      BUGS_TIER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bugs_tier || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Generate Allure report
        if: always()
        run: |
          npm install --global allure
          npm run test:allure
      - name: Publish Allure to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true
          enable_jekyll: false
      - name: Allure report URL
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          {
            echo "## Allure report"
            echo ""
            echo "[${REPORT_URL}](${REPORT_URL})"
            echo ""
            echo "This is the last published report (each run overwrites it). Tests may still be red; the report is published anyway."
            echo ""
            echo "If the URL 404s: Settings → Pages → Deploy from a branch → \`gh-pages\` / (root)."
          } >> "$GITHUB_STEP_SUMMARY"
