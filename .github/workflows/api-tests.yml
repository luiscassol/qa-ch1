name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Unique X-Candidate-Id (do not reuse your local tenant if that machine is testing)
        required: true
        type: string
      bugs_tier:
        description: X-Enable-Bugs
        required: true
        type: choice
        default: "off"
        options:
          - "off"
          - "easy"
          - "medium"
          - "hard"

# Not a required status check. off is expected to fail (baseline defects, e.g. F-01).
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      API_BASE_URL: https://dummy-api-topaz.vercel.app
      CANDIDATE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_id || format('ci-{0}', github.run_id) }}
      BUGS_TIER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bugs_tier || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Generate Allure report
        if: always()
        run: |
          npm install --global allure
          npm run test:allure
          touch allure-report/.nojekyll
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5
      - name: Upload Allure for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publish-allure:
    needs: playwright
    if: always() && !cancelled() && needs.playwright.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Allure report URL
        run: |
          {
            echo "## Allure report"
            echo ""
            echo "[${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})"
            echo ""
            echo "This is the last published report (each run overwrites it). Tests may still be red; the report is published anyway."
          } >> "$GITHUB_STEP_SUMMARY"
